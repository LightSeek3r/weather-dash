name: Feature request
description: An idea for Weather Dash
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: The problem you are trying to solve matters more than the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Where would you use it?
      description: A wall tablet, a TV, a phone on a desk... it changes what makes sense.
