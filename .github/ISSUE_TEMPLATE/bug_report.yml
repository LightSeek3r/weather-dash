name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead. A screenshot helps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown at the bottom of the settings sheet.
      placeholder: v1.0.0
  - type: input
    id: device
    attributes:
      label: Browser and device
      description: Include the screen size or resolution if the problem is about layout.
      placeholder: Chrome 130 on a 1920x1080 TV, Safari on an iPad (portrait)
  - type: dropdown
    id: install
    attributes:
      label: How do you run it?
      options: [Browser tab, Installed app (PWA), Kiosk browser, Not sure]
